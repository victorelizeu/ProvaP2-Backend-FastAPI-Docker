services:
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 3

    ports:
      - "5432:5432"

    volumes:
      - dbdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydatabase
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 3

    ports:
      - "5433:5432"

  app:
    build: .

    ports:
      - "8000:8000"

    env_file: .env
    
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  dbdata: